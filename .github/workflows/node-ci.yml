name: "CI and E2E Tests"

on:
  push:
    branches: [dev]

jobs:
  ci:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04  # Обновлено с ubuntu-latest до поддерживаемой версии
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'  # Добавлено кэширование npm
      - name: Install dependencies
        run: npm ci  # Изменено с npm i на npm ci для CI
      - name: Check types
        run: npm run typecheck
      - name: Lint with Biome
        run: npx @biomejs/biome check src/.
      - name: Lint styles
        run: npx stylelint **/*.{scss,css}
      - name: Test production build
        run: npm run build

  e2e_tests:
    needs: ci
    runs-on: ubuntu-22.04  # Обновлено до поддерживаемой версии
    steps:
      - name: Debug event info
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Deployment Status: ${{ github.action_status }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'  # Добавлено кэширование npm
      
      # Кэширование Playwright браузеров
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      
      - name: Install dependencies
        run: npm ci  # Изменено с npm install на npm ci
      
      - name: Wait for deployment to be live
        run: |
          echo "Waiting for Vercel deployment to be live..."
          until curl -sSf https://testing.discours.io > /dev/null; do
            printf '.'
            sleep 10
          done
      
      - name: create env file
        run: |
          touch .env
          echo TEST_PASSWORD=${{ secrets.TEST_PASSWORD }} >> .env  # Исправлено github.env на secrets
      
      - name: Install Playwright and dependencies
        run: npm run e2e:install
        if: steps.playwright-cache.outputs.cache-hit != 'true'  # Устанавливаем только если кэш не найден
      
      - name: Run Playwright tests
        run: npm run e2e:tests:ci
        env:
          BASE_URL: https://testing.discours.io
        continue-on-error: true
      
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      
      - name: Report test result if failed
        if: failure()
        run: echo "E2E tests failed. Please review the logs."
