name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: discoursio_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean Platform-Specific Dependencies
        run: |
          # Удаляем платформо-специфичные пакеты для Linux CI
          npm uninstall sass-embedded-darwin-arm64 sass-embedded-darwin-x64 || true
          npm uninstall @biomejs/cli-darwin-arm64 @biomejs/cli-darwin-x64 || true
          # Принудительно переустанавливаем Biome для текущей платформы
          npm uninstall @biomejs/biome || true
          npm install @biomejs/biome@^2.1.1
          npm install

      - name: Generate GraphQL types
        run: npm run codegen:all

      - name: TypeScript type check
        run: npm run typecheck

      - name: Install System Dependencies for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-0 \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libdbus-1-3 \
            libxcb1 \
            libxkbcommon0 \
            libx11-6 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2 \
            libatspi2.0-0 \
            libgtk-3-0 \
            libgstreamer-1.0-0 \
            libgtk-4-1 \
            libvulkan1 \
            libgraphene-1.0-0 \
            libxslt1.1 \
            libwoff1 \
            libvpx7 \
            libevent-2.1-7 \
            libopus0 \
            libgstreamer-plugins-base1.0-0 \
            libflite1 \
            libwebp7 \
            libavif13 \
            libharfbuzz-icu0 \
            libwebpmux3 \
            libenchant-2-2 \
            libsecret-1-0 \
            libhyphen0 \
            libmanette-0.2-1 \
            libgles2-mesa \
            libx264-163

      - name: Install Playwright
        run: |
          echo "Installing Playwright..."
          npm install -g @playwright/test
          npx playwright install --with-deps
          echo "Playwright installation complete"

      - name: Set Playwright environment
        run: |
          echo "Setting Playwright environment variables..."
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> $GITHUB_ENV
          echo "PATH=$HOME/.cache/ms-playwright/chromium-*/chrome-linux:$PATH" >> $GITHUB_ENV
          echo "Environment set:"
          echo "PLAYWRIGHT_BROWSERS_PATH: $PLAYWRIGHT_BROWSERS_PATH"
          echo "PATH: $PATH"
          echo "Current working directory: $(pwd)"
          echo "Node modules playwright location:"
          ls -la node_modules/@playwright/test/ || echo "No playwright in node_modules"

      - name: Verify Playwright browsers
        run: |
          echo "Installing Playwright browsers..."
          npx playwright install chromium
          npx playwright install firefox  
          npx playwright install webkit
          echo "Verifying browser installations..."
          npx playwright --version
          echo "Browser cache contents:"
          ls -la ~/.cache/ms-playwright/
          echo "Chromium executable check:"
          find ~/.cache/ms-playwright/ -name "*chromium*" -type f 2>/dev/null || echo "No chromium files found"
          echo "Environment variables:"
          echo "PLAYWRIGHT_BROWSERS_PATH: $PLAYWRIGHT_BROWSERS_PATH"
          echo "HOME: $HOME"
          echo "USER: $USER"

      - name: Test browser availability
        run: |
          echo "Testing browser availability..."
          npx playwright test --list --project=chromium || echo "Chromium not available"
          npx playwright test --list --project=firefox || echo "Firefox not available"
          npx playwright test --list --project=webkit || echo "Webkit not available"

      - name: Run browser check test
        run: |
          echo "Running browser check test to verify installation..."
          npx playwright test tests/e2e/browser-check.spec.ts --project=chromium --reporter=line

      - name: Verify browser executable
        run: |
          echo "Final browser executable verification..."
          echo "Looking for chromium executable:"
          find ~/.cache/ms-playwright/ -name "chrome" -o -name "headless_shell" -o -name "chromium" 2>/dev/null | head -5
          echo "Testing direct browser launch:"
          npx playwright exec chromium --version || echo "Direct launch failed"

      - name: Start nginx reverse proxy
        run: |
          docker run -d --name test-nginx -p 8080:80 \
            -v ${{ github.workspace }}/tests/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            --add-host=host.docker.internal:host-gateway \
            --health-cmd "curl -fs http://localhost:8080/_health" \
            --health-interval 2s --health-timeout 5s --health-retries 5 \
            nginx:1.18

      - name: Build application
        run: npm run build

      - name: Run tests
        run: |
          echo "Running E2E tests with explicit browser specification..."
          echo "Current working directory: $(pwd)"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Playwright version: $(npx playwright --version)"
          echo "Browser cache location: $(ls -la ~/.cache/ms-playwright/)"
          npx playwright test tests/e2e/ --project=chromium --reporter=github
        env:
          CI: true
          E2E_BASE_URL: http://localhost:8080
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 30
