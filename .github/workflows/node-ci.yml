name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: discoursio_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean Platform-Specific Dependencies
        run: |
          # Принудительно переустанавливаем Biome для текущей платформы
          npm uninstall @biomejs/biome || true
          npm install @biomejs/biome@^2.1.1
          npm install

      - name: Generate GraphQL types
        run: npm run codegen:all

      - name: TypeScript type check
        run: npm run typecheck

      - name: Install System Dependencies for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-0 \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libdbus-1-3 \
            libxcb1 \
            libxkbcommon0 \
            libx11-6 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2 \
            libatspi2.0-0 \
            libgtk-3-0 \
            libgstreamer-1.0-0 \
            libgtk-4-1 \
            libvulkan1 \
            libgraphene-1.0-0 \
            libxslt1.1 \
            libwoff1 \
            libvpx7 \
            libevent-2.1-7 \
            libopus0 \
            libgstreamer-plugins-base1.0-0 \
            libflite1 \
            libwebp7 \
            libavif13 \
            libharfbuzz-icu0 \
            libwebpmux3 \
            libenchant-2-2 \
            libsecret-1-0 \
            libhyphen0 \
            libmanette-0.2-1 \
            libgles2-mesa \
            libx264-163

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Verify Playwright browsers
        run: |
          npx playwright install chromium
          npx playwright install firefox  
          npx playwright install webkit
          npx playwright --version

      - name: Start nginx reverse proxy
        run: |
          docker run -d --name test-nginx -p 8080:80 \
            -v ${{ github.workspace }}/tests/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            --add-host=host.docker.internal:host-gateway \
            nginx:1.18

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm run e2e:ci
        env:
          CI: true
          E2E_BASE_URL: http://localhost:8080

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 30
