name: "Test Coverage Monitor"

# Запускаем после завершения основного CI
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main, dev]

jobs:
  coverage-analysis:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      # === SETUP SECTION (reused from main.yml) ===
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          # Отключаем кэширование для избежания проблем
          npm config set cache /tmp/npm-cache
          npm ci --no-optional

      - name: Clean Platform-Specific Dependencies
        run: |
          # Принудительно переустанавливаем Biome для текущей платформы
          npm uninstall @biomejs/biome || true
          npm install @biomejs/biome@^2.1.1
          # Убеждаемся что есть обычный sass для CI
          npm list sass || npm install sass@^1.89.0

      # === COMMON ENV VARS (reused from main.yml) ===
      - name: Set Common Environment Variables
        run: |
          echo "CI=true" >> $GITHUB_ENV
          echo "SASS_FORCE_JS=true" >> $GITHUB_ENV
          echo "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1" >> $GITHUB_ENV
          echo "E2E_BASE_URL=http://localhost:3001" >> $GITHUB_ENV

      - name: Download Test Results
        uses: actions/download-artifact@v3
        with:
          name: e2e-test-results
          path: ./
          workflow: ${{ github.event.workflow_run.id }}

      - name: Download Test Screenshots
        if: always()
        uses: actions/download-artifact@v3
        with:
          name: e2e-screenshots
          path: ./
          workflow: ${{ github.event.workflow_run.id }}

      - name: Generate Coverage Report
        if: success() # Только если предыдущие шаги успешны
        run: |
          echo "🔍 Анализ покрытия тестами..."
          
          # Генерируем детальный отчет
          npm run test:coverage
          
          echo "✅ Отчет о покрытии сгенерирован"

      - name: Upload Coverage Report
        if: success() # Только если анализ успешен
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report-${{ github.event.workflow_run.head_branch }}
          path: docs/test-coverage/
          retention-days: 90

      - name: Coverage Summary
        run: |
          echo "📊 ОТЧЕТ О ПОКРЫТИИ ТЕСТАМИ"
          echo "═══════════════════════════════════════════════════════════════"
          
          # Выводим статистику
          npm run test:stats
          
          echo "═══════════════════════════════════════════════════════════════"
          echo "📁 Детальный отчет: docs/test-coverage/"
          echo "🔗 Артефакт: coverage-report-${{ github.event.workflow_run.head_branch }}"

  coverage-notification:
    runs-on: ubuntu-latest
    needs: coverage-analysis
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      # === SETUP SECTION (reused from main.yml) ===
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          # Отключаем кэширование для избежания проблем
          npm config set cache /tmp/npm-cache
          npm ci --no-optional

      - name: Clean Platform-Specific Dependencies
        run: |
          # Принудительно переустанавливаем Biome для текущей платформы
          npm uninstall @biomejs/biome || true
          npm install @biomejs/biome@^2.1.1
          # Убеждаемся что есть обычный sass для CI
          npm list sass || npm install sass@^1.89.0

      # === COMMON ENV VARS (reused from main.yml) ===
      - name: Set Common Environment Variables
        run: |
          echo "CI=true" >> $GITHUB_ENV
          echo "SASS_FORCE_JS=true" >> $GITHUB_ENV
          echo "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1" >> $GITHUB_ENV
          echo "E2E_BASE_URL=http://localhost:3001" >> $GITHUB_ENV

      - name: Download Coverage Report
        uses: actions/download-artifact@v3
        with:
          name: coverage-report-${{ github.event.workflow_run.head_branch }}
          path: docs/test-coverage/

      - name: Generate Coverage Summary
        run: |
          echo "📋 СВОДКА ПОКРЫТИЯ ТЕСТАМИ"
          echo "═══════════════════════════════════════════════════════════════"
          
          # Создаем краткую сводку
          cat docs/test-coverage/README.md | head -30
          
          echo "═══════════════════════════════════════════════════════════════"
          echo "📊 Полный отчет: docs/test-coverage/index.html"
