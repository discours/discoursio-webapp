name: "Test Coverage Monitor"

# Запускаем после завершения основного CI
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main, dev]

jobs:
  coverage-analysis:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-optional

      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          name: e2e-test-results
          path: ./
          workflow: ${{ github.event.workflow_run.id }}

      - name: Generate Coverage Report
        run: |
          echo "🔍 Анализ покрытия тестами..."
          
          # Генерируем детальный отчет
          npm run test:coverage
          
          echo "✅ Отчет о покрытии сгенерирован"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.event.workflow_run.head_branch }}
          path: docs/test-coverage/
          retention-days: 90

      - name: Coverage Summary
        run: |
          echo "📊 ОТЧЕТ О ПОКРЫТИИ ТЕСТАМИ"
          echo "═══════════════════════════════════════════════════════════════"
          
          # Выводим статистику
          npm run test:stats
          
          echo "═══════════════════════════════════════════════════════════════"
          echo "📁 Детальный отчет: docs/test-coverage/"
          echo "🔗 Артефакт: coverage-report-${{ github.event.workflow_run.head_branch }}"

  coverage-notification:
    runs-on: ubuntu-latest
    needs: coverage-analysis
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --no-optional

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-${{ github.event.workflow_run.head_branch }}
          path: docs/test-coverage/

      - name: Generate Coverage Summary
        run: |
          echo "📋 СВОДКА ПОКРЫТИЯ ТЕСТАМИ"
          echo "═══════════════════════════════════════════════════════════════"
          
          # Создаем краткую сводку
          cat docs/test-coverage/README.md | head -30
          
          echo "═══════════════════════════════════════════════════════════════"
          echo "📊 Полный отчет: docs/test-coverage/index.html"
