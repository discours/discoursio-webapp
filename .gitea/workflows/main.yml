name: "CI Pipeline"

# Переменные окружения для E2E тестов:
# E2E_TEST_USERNAME - email тестового пользователя
# E2E_TEST_PASSWORD - пароль тестового пользователя
# Эти переменные должны быть настроены в секретах репозитория

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          # Отключаем кэширование для избежания проблем
          npm config set cache /tmp/npm-cache
          npm ci --no-optional

      - name: Clean Platform-Specific Dependencies
        run: |
          # Удаляем платформо-специфичные пакеты для Linux CI
          npm uninstall sass-embedded-darwin-arm64 sass-embedded-darwin-x64 || true
          npm uninstall @biomejs/cli-darwin-arm64 @biomejs/cli-darwin-x64 || true
          # Принудительно переустанавливаем Biome для текущей платформы
          npm uninstall @biomejs/biome || true
          npm install @biomejs/biome@^2.1.1
          npm install

      - name: Run Postinstall Scripts
        run: |
          echo "Running postinstall scripts..."
          npm run postinstall || echo "Postinstall failed, will generate types manually"

      - name: Generate GraphQL Types
        run: |
          echo "Generating GraphQL types..."
          echo "Current directory: $(pwd)"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          
          # Проверяем что файлы существуют
          echo "Checking if GraphQL files exist:"
          ls -la src/graphql/mutation/chat/ || echo "Chat mutations not found"
          ls -la src/graphql/query/chat/ || echo "Chat queries not found"
          
          # Генерируем типы
          npm run codegen:all
          
          echo "Types generated successfully"
          echo "Generated files:"
          ls -la src/graphql/generated/
          ls -la src/graphql/generated/inbox/ || echo "Inbox directory not found"
          
          # Проверяем что chat.ts создался
          if [ -f "src/graphql/generated/chat.ts" ]; then
            echo "✅ chat.ts exists"
            head -5 src/graphql/generated/chat.ts
          else
            echo "❌ chat.ts not found"
            exit 1
          fi

      - name: Lint Code
        run: npx @biomejs/biome check src/

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Build Project
        run: npm run build

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            .next/
            build/
          retention-days: 7

  e2e-tests:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Clean Platform-Specific Dependencies
        run: |
          # Удаляем платформо-специфичные пакеты для Linux CI
          npm uninstall sass-embedded-darwin-arm64 sass-embedded-darwin-x64 || true
          npm uninstall @biomejs/cli-darwin-arm64 @biomejs/cli-darwin-x64 || true
          # Принудительно переустанавливаем Biome для текущей платформы
          npm uninstall @biomejs/biome || true
          npm install @biomejs/biome@^2.1.1
          npm install

      - name: Install WebKit Playwright
        run: |
          npx playwright install webkit --with-deps

      - name: Run E2E Tests
        env:
          E2E_TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npm run test:e2e

      - name: Archive E2E Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 5

  performance-check:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Lighthouse Performance Check
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://discours.io
          uploadArtifacts: true
          temporaryPublicStorage: true
