name: "CI Pipeline"

# Переменные окружения для E2E тестов:
# E2E_TEST_USERNAME - email тестового пользователя
# E2E_TEST_PASSWORD - пароль тестового пользователя
# Эти переменные должны быть настроены в секретах репозитория

on:
  push:
      branches: [main, dev, feature/*, hotfix/*]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # === SETUP SECTION (reused in test-coverage.yml) ===
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          # Отключаем кэширование для избежания проблем
          npm config set cache /tmp/npm-cache
          npm ci --no-optional

      - name: Clean Platform-Specific Dependencies
        run: |
          # Принудительно переустанавливаем Biome для текущей платформы
          npm uninstall @biomejs/biome || true
          npm install @biomejs/biome@^2.1.1
          # Убеждаемся что есть обычный sass для CI
          npm list sass || npm install sass@^1.89.0

      - name: Setup Playwright (use pre-installed browsers)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          # Используем предустановленные браузеры в системе
          npx playwright --version

      - name: Create Test Directories
        run: |
          mkdir -p test-results
          mkdir -p playwright-report
          mkdir -p playwright/.cache

      - name: Lint Code
        run: npx @biomejs/biome check src/

      - name: TypeScript Type Check
        run: npm run typecheck
        continue-on-error: true

      - name: Build Project
        env:
          SASS_FORCE_JS: true
        run: npm run build

      # Определяем тип тестов в зависимости от ветки
      - name: Determine Test Strategy
        id: test-strategy
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "strategy=full" >> $GITHUB_OUTPUT
            echo "🎯 Main branch: запускаем полный набор E2E тестов"
          else
            echo "strategy=smoke" >> $GITHUB_OUTPUT
            echo "🔥 Feature/dev branch: запускаем только smoke тесты"
          fi

      # === COMMON ENV VARS (reused in test-coverage.yml) ===
      - name: Set Common Environment Variables
        run: |
          echo "CI=true" >> $GITHUB_ENV
          echo "SASS_FORCE_JS=true" >> $GITHUB_ENV
          echo "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1" >> $GITHUB_ENV
          echo "TEST_USERNAME=${{ secrets.E2E_TEST_USERNAME }}" >> $GITHUB_ENV
          echo "TEST_PASSWORD=${{ secrets.E2E_TEST_PASSWORD }}" >> $GITHUB_ENV
          echo "E2E_BASE_URL=http://localhost:3001" >> $GITHUB_ENV

      # Smoke тесты (быстрые критичные проверки)
      - name: Run Smoke E2E Tests
        if: steps.test-strategy.outputs.strategy == 'smoke'
        run: npx playwright test tests/e2e --grep "@smoke" --project=chromium --reporter=line

      # Полный набор E2E тестов (только для main)
      - name: Run Full E2E Tests
        if: steps.test-strategy.outputs.strategy == 'full'
        run: npx playwright test tests/e2e --project=chromium --reporter=line

      - name: Archive E2E Test Results
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-results
          path: |
            playwright-report/
            test-results/
            playwright/.cache/
          retention-days: 5

      - name: Archive Test Screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-screenshots
          path: test-results/
          retention-days: 5

      - name: Archive Test Videos
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-videos
          path: test-results/
          retention-days: 5

      # Генерируем отчет о покрытии тестами только если тесты прошли
      - name: Generate Test Coverage Report
        if: success() # Только если тесты прошли
        run: |
          echo "📊 Генерация отчета о покрытии тестами..."
          
          # Устанавливаем права на выполнение скрипта
          chmod +x scripts/test-coverage.js
          
          # Генерируем отчет
          npm run test:coverage
          
          echo "✅ Отчет о покрытии сгенерирован"

      # Архивируем отчет о покрытии только если тесты прошли
      - name: Archive Test Coverage Report
        if: success() # Только если предыдущие шаги успешны
        uses: actions/upload-artifact@v3
        with:
          name: test-coverage-report
          path: docs/test-coverage/
          retention-days: 30

      # Выводим краткую статистику в логи CI
      - name: Display Test Statistics
        if: always() # Всегда показываем статистику
        run: |
          echo "📈 СТАТИСТИКА ТЕСТОВ В CI"
          echo "═══════════════════════════════════════════════════════════════"
          
          # Быстрый просмотр статистики
          npm run test:stats
          
          echo "═══════════════════════════════════════════════════════════════"
          
          # Показываем разную информацию в зависимости от результата
          if [ "${{ job.status }}" == "success" ]; then
            echo "💡 Детальный отчет доступен в артефактах: test-coverage-report"
          else
            echo "⚠️ Тесты не прошли, отчет о покрытии не генерировался"
            echo "🔧 Исправьте ошибки в тестах и перезапустите CI"
          fi

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-output
          path: |
            dist/
            .next/
            build/
          retention-days: 7

  push-to-github:
    needs: build-and-test
    if: ${{ needs.build-and-test.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Git
        run: |
          git config --global user.name "Discours"
          git config --global user.email "services@discours.io"
          git config --global init.defaultBranch dev
      
      - name: Configure GitHub Remote
        run: |
          # Check if GitHub token is available
          if [[ -z "${{ secrets.GITHUB_TOKEN }}" ]]; then
            echo "❌ GITHUB_TOKEN secret is not set!"
            echo "⚠️ Skipping GitHub sync due to missing token"
            exit 0
          fi
          
          # Remove existing remote if it exists
          git remote remove github 2>/dev/null || true
          
          # Add GitHub remote with token authentication
          git remote add github https://${{ secrets.GITHUB_TOKEN }}@github.com/discours/discoursio-webapp.git
          
          # Test remote connection
          echo "Testing GitHub remote connection..."
          if git ls-remote github HEAD; then
            echo "✅ Successfully connected to GitHub remote"
                    else
            echo "❌ Failed to connect to GitHub remote"
            echo "Checking token permissions..."
            curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/discours/discoursio-webapp || true
            echo "⚠️ Skipping GitHub sync due to connection issues"
            exit 0
          fi
          
          # Fetch all branches and tags from GitHub
          echo "Fetching from GitHub..."
          git fetch github
      
      - name: Sync Current Branch
        run: |
          # Get current branch name
          CURRENT_BRANCH=${GITHUB_REF#refs/heads/}
          echo "Current branch: $CURRENT_BRANCH"
          
          # Skip main and dev branches
          if [[ "$CURRENT_BRANCH" == "main" || "$CURRENT_BRANCH" == "dev" ]]; then
            echo "⏭️ Skipping sync for protected branch: $CURRENT_BRANCH"
            exit 0
          fi
          
          # Debug information
          echo "=== Debug Info ==="
          echo "Git status:"
          git status --porcelain
          echo "Current HEAD:"
          git log --oneline -1
          echo "Remote info:"
          git remote -v
          
          # Push only feature/* and hotfix/* branches that passed CI
          echo "=== Syncing branch: $CURRENT_BRANCH ==="
          
          # Try force-with-lease first
          if git push github $CURRENT_BRANCH:$CURRENT_BRANCH --force-with-lease; then
            echo "✅ Successfully synced with --force-with-lease"
          else
            echo "⚠️ Force-with-lease failed, trying regular force push..."
            if git push github $CURRENT_BRANCH:$CURRENT_BRANCH --force; then
              echo "✅ Successfully synced with --force"
            else
              echo "❌ Both push attempts failed!"
              echo "=== Git push error details ==="
              git push github $CURRENT_BRANCH:$CURRENT_BRANCH --force -v 2>&1 || true
              echo "⚠️ GitHub sync failed, but continuing workflow"
              exit 0
            fi
          fi
      
      - name: Verify Sync
        run: |
          echo "=== GitHub Remote Branches ==="
          git ls-remote --heads github

