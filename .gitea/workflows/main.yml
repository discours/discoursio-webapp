name: "CI Pipeline"

# Переменные окружения для E2E тестов:
# E2E_TEST_USERNAME - email тестового пользователя
# E2E_TEST_PASSWORD - пароль тестового пользователя
# Эти переменные должны быть настроены в секретах репозитория

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          # Отключаем кэширование для избежания проблем
          npm config set cache /tmp/npm-cache
          npm ci --no-optional

      - name: Clean Platform-Specific Dependencies
        run: |
          # Удаляем платформо-специфичные пакеты для Linux CI
          npm uninstall sass-embedded-darwin-arm64 sass-embedded-darwin-x64 || true
          npm uninstall @biomejs/cli-darwin-arm64 @biomejs/cli-darwin-x64 || true
          # Принудительно переустанавливаем Biome для текущей платформы
          npm uninstall @biomejs/biome || true
          npm install @biomejs/biome@^2.1.1
          npm install

      - name: Install Playwright Browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium
          npx playwright --version
          ls -la node_modules/@playwright/test/node_modules/playwright-core/.local-browsers/ || echo "No browsers directory found"

      - name: Lint Code
        run: npx @biomejs/biome check src/

      - name: TypeScript Type Check
        run: npm run typecheck
        continue-on-error: true

      - name: Build Project
        run: npm run build

      - name: Run E2E Tests (Chromium)
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: 0
          TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_BASE_URL: http://localhost:3001
        run: npx playwright test tests/e2e --project=chromium --reporter=line

      - name: Archive E2E Test Results
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 5

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            .next/
            build/
          retention-days: 7

  push-to-github:
    needs: build-and-test
    if: ${{ needs.build-and-test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push mirror to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "CI Mirror"
          git config --global user.email "ci@discours.io"
          git remote add github https://$GH_TOKEN@github.com/discours/discoursio-webapp.git
          # Push all branches and tags (mirror-like)
          git push github +refs/heads/*:refs/heads/* --force
          git push github --tags --force

  performance-check:
    needs: push-to-github
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Lighthouse Performance Check
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://testing.discours.io
          uploadArtifacts: true
          temporaryPublicStorage: true
